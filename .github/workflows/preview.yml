name: Post branch preview URL

on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: read
  pull-requests: write

jobs:
  post_preview_url:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Create or update the preview comment
        uses: actions/github-script@v7
        with:
          script: |
            const marker = '<!-- innovetron-preview -->';
            const pr = context.payload.pull_request;
            const url = `https://raw.githack.com/${pr.head.repo.full_name}/${pr.head.sha}/index.html`;
            const body = `${marker}\n[Preview this version of the website](${url}). Production updates only after merge.`;
            const comments = await github.paginate(github.rest.issues.listComments, {
              ...context.repo, issue_number: pr.number
            });
            const existing = comments.find(comment =>
              comment.user.type === 'Bot' && comment.body.startsWith(marker)
            );
            if (existing) {
              await github.rest.issues.updateComment({
                ...context.repo, comment_id: existing.id, body
              });
            } else {
              await github.rest.issues.createComment({
                ...context.repo, issue_number: pr.number, body
              });
            }
