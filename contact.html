<!DOCTYPE html>
<html lang="en-gb" class="no-js"> 
<head>
    <title>INNOVETRON</title>
    <link rel="icon" type="image/x-icon" href="figures/favicon.ico">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
    <meta name="description" content="Innovetron - Transforming concepts into cutting-Edge reality.">
    <meta name="keywords" content="Innovetron, technology, consulting, solutions, hardware, software, engineering">
    <meta name="author" content="Innovetron">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-SgOJa3DmI69IUzQ2PVdRZhwQ+dy64/BUtbMJw1MZ8t5HZApcHrRKUc4W0kG879m7" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>
    <link rel="stylesheet" href="css/style1.css">
</head>

<!-- Body Start -->
<body>
    <!-- Header -->
    <div id="navbar"></div>

    <!-- Contact -->
    <section id="contact" class="bg-dark text-light-gray text-justify px-4">
        <div class="container">
            <div class="heading text-center">
                <!-- Heading -->
                <h2 class="text-innovetron m-4">Contact me for job opportunities</h2>
                <p>I’d love to hear from you. I am interested in full-time and part-time offeres aligning with my
                    experties. </p>
                <p>Fill out the form below and I will get back to you.</p>
            </div>
            <div class="d-flex justify-content-center">
                <div class="col-md-6 col-sm-6">
                    <form method="post" action="https://formspree.io/f/moqgyplv" id="contactfrm" role="form">
                        <div class="mb-3">
                            <label for="message-name" class="form-label">Name *</label>
                            <input type="text" class="form-control" name="name" id="message-name" placeholder="Enter name"
                                title="Please enter your name" required>
                        </div>
                        <div class="mb-3">
                            <label for="message-email" class="form-label">Email *</label>
                            <input type="email" class="form-control" name="email" id="message-email"
                                placeholder="Enter email" title="Please enter a valid email address" required>
                        </div>
                        <div class="mb-3">
                            <label for="message-title" class="form-label">Title *</label>
                            <input name="title" class="form-control" type="tel" id="message-title" size="128" value=""
                                placeholder="Enter title" title="Please enter a title" required>
                        </div>
                        <div class="mb-3">
                            <label for="message" class="form-label">Message *</label>
                            <textarea name="comment" class="form-control" id="message" placeholder="Enter your message…"
                                title="Please enter your message" style="height: 200px" required></textarea>
                        </div>
                        <div class="d-flex justify-content-end">
                            <button name="submit" type="submit" class="btn btn-primary" id="submit">Submit</button>
                        </div>
                        <div class="result"></div>
                    </form>
                </div>
            </div>
        </div>
    </section>

    <div id="footer"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/js/bootstrap.bundle.min.js" integrity="sha384-k6d4wzSIapyDyv1kpU366/PK5hCdSbCRGRCMv+eplOQJWyd1fbcAu9OCUj5zNLiq" crossorigin="anonymous"></script>
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <script>
        $(document).ready(function () {
            $('#navbar').load('navbar.html');
            $('#footer').load('footer.html');
        });
    </script>
</body>

</html>
