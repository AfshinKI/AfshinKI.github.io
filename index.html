<!DOCTYPE html>
<html lang="en-gb" class="no-js"> 
<head>
    <title>INNOVETRON</title>
    <link rel="icon" type="image/x-icon" href="figures/favicon.ico">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
    <meta name="description" content="Innovetron - Transforming concepts into cutting-Edge reality.">
    <meta name="keywords" content="Innovetron, technology, consulting, solutions, hardware, software, engineering">
    <meta name="author" content="Innovetron">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-SgOJa3DmI69IUzQ2PVdRZhwQ+dy64/BUtbMJw1MZ8t5HZApcHrRKUc4W0kG879m7" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>
    <link rel="stylesheet" href="css/style1.css">
</head>

<!-- Body Start -->
<body>
    <!-- Header -->
    <div id="navbar"></div>

    <!-- Home -->
    <section id="home" class="p-0">
        <div class="carousel-inner vh-100 w-100">
            <div class="carousel-item active h-100">
                <img src="figures/circuit_sample.jpg" alt="Circuit Sample">
                <div class="carousel-caption d-flex justify-content-center align-items-center flex-column">
                    <h1 class="display-2 font-weight-bold">INNOVETRON</h1>
                    <div class="w-75 divider m-3"></div>
                    <h4>Transforming Concepts into Cutting-Edge Reality.</h4>
                    <a href="contact.html" class="btn btn-lg btn-primary m-3" >Contact Us</a>
                    <a href="#services" class="carousel-go-below text-innovetron" id="go-to-service">
                        <i class="fa fa-chevron-down fa-3x bounce"></i>
                    </a>
                </div>
            </div>
        </div>
    </section>
    <div class="divider"></div>
    
    <!-- section start -->
    <section id="services" class="bg-light text-secondary ">
        <div class="container wow animate__animated animate__fadeInUp">
            <h2 class="heading text-center text-innovetron m-4">Services</h2>
            <div id="service-contents"></div> <!-- Filled by services.js -->
        </div>
    </section>

    <!-- About the Company-->
    <section id="about" class="bg-dark text-light-gray" >
        <div class="container wow animate__animated animate__fadeInUp">
            <!-- Heading -->
            <h2 class="heading text-center text-innovetron m-4">About</h2>
            <div id="about-contents"></div> <!-- Filled by about.js -->
        </div>
    </section>

    <div id="footer"></div>

    <!-- Back to Top Button -->
     <div class="d-flex justify-content-end fixed-bottom">
         <a href="#navbar" id="backToTop" class="text-innovetron m-3" >
             <i class="fa-solid fa-chevron-up fa-2x"></i>
        </a>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/js/bootstrap.bundle.min.js" integrity="sha384-k6d4wzSIapyDyv1kpU366/PK5hCdSbCRGRCMv+eplOQJWyd1fbcAu9OCUj5zNLiq" crossorigin="anonymous"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/wow/1.1.2/wow.min.js" integrity="sha512-Eak/29OTpb36LLo2r47IpVzPBLXnAMPAVypbSZiZ4Qkf8p/7S/XRG5xp7OKWPPYfJT6metI+IORkR5G8F900+g==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <script src="js/services.js" type="text/javascript"></script>
    <script src="js/about.js" type="text/javascript"></script>
    <script>
        new WOW().init();
        $(document).ready(function () {
            $('#navbar').load('navbar.html');
            $('#footer').load('footer.html');

            const sections = $('section'); // All the <section> tags
            const navLinks = $('.nav-link');

            $(window).on('scroll', function () {
            const scrollPos = $(document).scrollTop();

            sections.each(function () {
                const top = $(this).offset().top - 120;
                const bottom = top + $(this).outerHeight();
                const id = $(this).attr('id');

                if (scrollPos >= top && scrollPos < bottom) {
                navLinks.removeClass('active');
                $(`.nav-link[href="#${id}"]`).addClass('active');
                }
            });
            });
        });
        document.addEventListener("DOMContentLoaded", function () {
            const backToTop = document.getElementById("backToTop");

            window.addEventListener("scroll", function () {
                if (window.scrollY > 100) {
                    backToTop.style.display = "block";
                } else {
                    backToTop.style.display = "none";
                }
            });
        });
    </script>
</body>

</html>
